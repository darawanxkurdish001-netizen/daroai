<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daro AI - چوونەژوورەوە</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #050816; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .login-container { background: #111827; padding: 40px 30px; border-radius: 24px; border: 1px solid #312e81; width: 100%; max-width: 420px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    h2 { margin-bottom: 10px; color: #8b5cf6; font-size: 28px; }
    p { color: #9ca3af; margin-bottom: 30px; font-size: 14px; }
    input { width: 100%; padding: 16px; margin-bottom: 15px; border: 1px solid #374151; border-radius: 12px; background: #1f2937; color: white; font-size: 16px; outline: none; transition: 0.3s; text-align: right; }
    input:focus { border-color: #8b5cf6; }
    .btn { background: #8b5cf6; color: white; padding: 14px 20px; border: none; border-radius: 12px; font-size: 16px; cursor: pointer; width: 100%; font-weight: bold; margin-bottom: 12px; transition: 0.3s; }
    .btn:hover { background: #7c3aed; }
    .btn-secondary { background: #1f2937; border: 1px solid #374151; }
    .btn-secondary:hover { background: #374151; }
  </style>
</head>
<body>

<div class="login-container">
  <h2>Daro AI</h2>
  <p>بەخێربێیت، تکایە بۆ چوونە ناو داشبۆرد لۆگین بکە</p>
  
  <input type="email" id="email" placeholder="ئیمەیڵەکەت بنووسە">
  <input type="password" id="password" placeholder="وشەی تێپەڕ بنووسە">
  
  <button onclick="login()" class="btn">چوونەژوورەوە (Login)</button>
  <button onclick="signup()" class="btn btn-secondary">دروستکردنی ئەکاونتی نوێ (Sign Up)</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCvpvG3ddAgJWQrBC_eOo77hy0fKieFSMA",
  authDomain: "daroai.firebaseapp.com",
  projectId: "daroai",
  storageBucket: "daroai.firebasestorage.app",
  messagingSenderId: "1096911162995",
  appId: "1:1096911162995:web:22bca6799ab7777265e406"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// فەنکشنی لۆگینبوون
window.login = async function() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();
  
  if(!email || !password) return alert("تکایە هەموو خانەکان پڕبکەرەوە");
  
  try {
    await signInWithEmailAndPassword(auth, email, password);
    window.location.href = "dashboard.html";
  } catch (error) {
    alert("هەڵە لە چوونەژوورەوە: " + error.message);
  }
}

// فەنکشنی دروستکردنی ئەکاونت
window.signup = async function() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();
  
  if(!email || !password) return alert("تکایە هەموو خانەکان پڕبکەرەوە");
  
  try {
    await createUserWithEmailAndPassword(auth, email, password);
    alert("ئەکاونتەکەت بە سەرکەوتوویی دروستکرا!");
    window.location.href = "dashboard.html";
  } catch (error) {
    alert("هەڵە لە دروستکردنی ئەکاونت: " + error.message);
  }
}
</script>

</body>
</html>
