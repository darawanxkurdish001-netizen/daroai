<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daro AI - Login</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
    body{background:#050816;color:white;display:flex;justify-content:center;align-items:center;min-height:100vh;}
    .login-container{background:#111827;padding:30px;border-radius:20px;border:1px solid #312e81;width:100%;max-width:400px;text-align:center;}
    h2{margin-bottom:20px;color:#8b5cf6;}
    .btn{background:#1877F2;color:white;padding:14px 20px;border:none;border-radius:12px;font-size:16px;cursor:pointer;width:100%;font-weight:bold;}
  </style>
</head>
<body>

<div class="login-container">
  <h2>Daro AI</h2>
  <p style="color:#9ca3af; margin-bottom:20px;">بۆ چوونە ناو داشبۆرد فەیسبووکەکەت ببەستەوە</p>
  <button onclick="facebookLogin()" class="btn">Login with Facebook</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithPopup, FacebookAuthProvider } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCvpvG3ddAgJWQrBC_eOo77hy0fKieFSMA",
  authDomain: "daroai.firebaseapp.com",
  projectId: "daroai",
  storageBucket: "daroai.firebasestorage.app",
  messagingSenderId: "1096911162995",
  appId: "1:1096911162995:web:22bca6799ab7777265e406"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const provider = new FacebookAuthProvider();
provider.addScope('public_profile');
provider.addScope('email');

window.facebookLogin = async function () {
  try {
    // بەکارهێنانی signInWithPopup لەبری signInWithRedirect
    const result = await signInWithPopup(auth, provider);
    if (result.user) {
      window.location.href = "dashboard.html";
    }
  } catch (error) {
    alert("هەڵە: " + error.message);
  }
};
</script>

</body>
</html>
