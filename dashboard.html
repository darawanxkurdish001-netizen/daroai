<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daro AI Dashboard</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#050816;
color:white;
padding:20px;
}

.header{
background:#111827;
padding:20px;
border-radius:20px;
margin-bottom:20px;
border:1px solid #312e81;
}

.header h1{
color:#8b5cf6;
margin-bottom:10px;
}

.card{
background:#111827;
padding:20px;
border-radius:20px;
margin-bottom:20px;
border:1px solid #312e81;
}

.card h2{
color:#8b5cf6;
margin-bottom:10px;
}

.btn{
width:100%;
padding:15px;
background:#8b5cf6;
color:white;
border:none;
border-radius:12px;
font-size:18px;
cursor:pointer;
}
</style>
</head>

<body>

<div class="header">
<h1>Daro AI Dashboard</h1>
<p>بەخێربێیت بۆ داشبۆردی Daro AI 🚀</p>
</div>

<div class="card">
<h2>Facebook Connect</h2>
<p>پەیجەی فەیسبووک پەیوەست بکە</p>
<button class="btn">Connect Facebook</button>
</div>

<div class="card">
<h2>AI Replies</h2>
<p>وەڵامدانەوەی خۆکار چالاک بکە</p>
<button class="btn">Enable AI</button>
</div>

<div class="card">
<h2>Comments</h2>
<p>کۆمێنتەکانت ببینە</p>
<button class="btn">Open Comments</button>
</div>

</body>
</html>
