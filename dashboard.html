<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCvpvG3ddAgJWQrBC_eOo77hy0fKieFSMA",
  authDomain: "daroai.firebaseapp.com",
  projectId: "daroai",
  storageBucket: "daroai.firebasestorage.app",
  messagingSenderId: "1096911162995",
  appId: "1:1096911162995:web:22bca6799ab7777265e406"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// Signup
window.signup = async function () {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();

  if (!email || !password) {
    alert("Email و Password پڕ بکە");
    return;
  }

  try {
    await createUserWithEmailAndPassword(auth, email, password);
    alert("Account Created Successfully");
  } catch (error) {
    alert(error.message);
    console.error(error);
  }
};

// Login
window.login = async function () {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();

  if (!email || !password) {
    alert("Email و Password پڕ بکە");
    return;
  }

  try {
    await signInWithEmailAndPassword(auth, email, password);
    alert("Login Success");

    // Go to dashboard
    window.location.href = "/dashboard.html";

  } catch (error) {
    alert(error.message);
    console.error(error);
  }
};
</script>
